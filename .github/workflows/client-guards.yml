# Architecture guards for the Next.js client.
# Runs boundary + SSOT + route inventory scripts on every PR/push that touches the client.
name: Client guards

on:
  pull_request:
    paths:
      - "client/src/**"
      - "client/scripts/**"
      - "client/ROUTE_INVENTORY.md"
      - "client/DOMAIN_MAP.md"
      - "client/package.json"
      - "services/api/server.js"
      - ".github/workflows/client-guards.yml"
  push:
    branches: [main, master]
    paths:
      - "client/src/**"
      - "client/scripts/**"
      - "client/ROUTE_INVENTORY.md"
      - "client/package.json"
      - "services/api/server.js"

jobs:
  guards:
    name: Boundaries + inventory + public imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run guards
        working-directory: client
        run: |
          node scripts/check-import-boundaries.mjs
          node scripts/check-earth-history-ssot.mjs
          node scripts/check-agent-tool-schema.mjs
          node scripts/check-app-public-imports.mjs
          node scripts/check-feature-public-imports.mjs
          node scripts/check-store-imports.mjs
          node scripts/check-components-public.mjs
          node scripts/gen-route-inventory.mjs --check
