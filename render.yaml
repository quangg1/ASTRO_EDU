# Render Blueprint — API (Node) + client (Static Site CDN).
# Biến: shared/envNames.js — hướng dẫn: docs/render-deploy.md

services:
  - type: web
    name: galaxies-api
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm run install:all
    startCommand: cd services/api && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_API_SECRET
        generateValue: true
      - key: CLIENT_URL
        fromService:
          type: web
          name: galaxies-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: API_PUBLIC_URL
        fromService:
          type: web
          name: galaxies-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VNPAY_TMN_CODE
        sync: false
      - key: VNPAY_HASH_SECRET
        sync: false
      - key: VNPAY_HOST
        sync: false
      - key: VNPAY_TEST_MODE
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: S3_MEDIA_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: MEDIA_CDN_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

  - type: web
    name: galaxies-web
    runtime: static
    region: singapore
    plan: starter
    rootDir: client
    buildCommand: npm ci && npm run build:static
    staticPublishPath: out
    autoDeploy: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: galaxies-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_MEDIA_CDN
        sync: false
      - key: NEXT_PUBLIC_AI_SERVICE_URL
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
